- type: entity
  parent: BaseStorageItem
  id: StrawberryToptartBox
  name: Strawberry Toptart Box
  description: A small box of Strawberry toptarts, yummers!
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Consumable/Food/toptart_boxes.rsi
    layers:
    - map: [ base ]
      state: toptart_strawberry_box
  - type: Item
    size: Normal
  - type: Storage
    grid:
    - 0,0,2,0
    whitelist:
      tags:
      - TopTart
    hideStackVisualsWhenClosed: false
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: toptart_strawberry_box1 }
          False: { state: toptart_strawberry_box }
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FoodSnackTopTartStrawberry
          rolls: 3
  - type: ItemCounter
    count:
      tags: [FoodSnack]
    composite: false
  - type: Appearance

