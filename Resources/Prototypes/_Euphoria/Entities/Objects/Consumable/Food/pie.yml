# blackberry
- type: entity
  name: blackberry pie
  parent: FoodPieBase
  id: FoodPieBlackberry
  description: Tastes good enough to make a grown man cry.
  components:
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Sprite
    sprite: _Euphoria/Objects/Consumable/Food/berry_food.rsi
    state: blackberrypie
  - type: SliceableFood
    slice: FoodPieBlackberrySlice
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: slice of blackberry pie
  parent: FoodPieSliceBase
  id: FoodPieBlackberrySlice
  components:
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Sprite
    layers:
    - state: plain-slice
    - state: alpha-slice-filling
      color: black
  - type: Tag
    tags:
    - Fruit
    - Pie
    - Slice

