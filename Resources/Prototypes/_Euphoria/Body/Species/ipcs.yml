- type: entity
  parent: [OrganBaseStomach, OrganIPCInternal, OrganIPCMetabolizer]
  id: OrganIPCStomach
  name: IPC Stomach
  description: "Some shit releated to an organ i dont fucking know shi about robots"
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - IPCDrink
    isSpecialDigestibleExclusive: true
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 80
  sprite: _FarHorizons/Mobs/Species/IPC/organs.rsi
  layers:
  - state: heart-on

