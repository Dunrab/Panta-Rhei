- type: entity
  parent: BaseItem
  id: HairBrush
  name: hair brush
  description: A small fine toothed comb used to brush hair and fur.
  components:
  - type: Sprite
    sprite: _Floof/Objects/Misc/brush.rsi
    state: brush
  - type: PopUpOnUse
    popUpDoAfterTime: 3
    userPopUpMsg: self-brushing-success
    targetPopUpMsg: target-brushing-success
    whitelist:
      components:
        - MobState
        - Clothing
    blacklist:
      components:
        - Silicon
  - type: MeleeWeapon
    wideAnimationRotation: 180
    attackRate: 2
    damage:
      types:
        Blunt: 0
