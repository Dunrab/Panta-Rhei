- type: entity
  parent: BaseMedicalPDA
  id: FreelancerPDA
  name: Freelancer PDA
  description: Refurbished standard PDA
  components:
  - type: Sprite
    sprite: _Floof/Objects/Devices/pda.rsi
  - type: Icon
    sprite: _Floof/Objects/Devices/pda.rsi # DeltaV aPDA Resprite File Path
    state: pda-free
  - type: Pda
    id: FreelancerIDCard
  - type: PdaBorderColor
    borderColor: "#668643"

# Alternative PDA base
- type: entity
  parent: BasePDA
  id: BaseAlternativePDA
  name: Base Alternative PDA
  description: Personal Data Assistant.
  components:
  - type: Pda
    id: PassengerIDCard
  - type: Sprite
    sprite: _Floof/Objects/Devices/alternative_head_pda.rsi
    state: pda
    scale: 1.02, 1.02 # increase the scale to match the size of delta-v pdas
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda"
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      offset: 0.1, 0.0 # 1.5 is WAY TOO FUCKING FAR, like in the next universe far
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      offset: 0.11, 0.1 # 0.125 is too far to the right
      shader: "unshaded"
      visible: false
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda
  - type: Icon
    sprite: _Floof/Objects/Devices/alternative_head_pda.rsi
    state: pda

# captain
- type: entity
  parent: BaseAlternativePDA
  id: CommanderPDA
  name: commander PDA
  description: For those who lead the station in style.
  components:
  - type: Pda
    id: CommanderIDCard
    penSlot:
      startingItem: PenCap # have to give captain their fancy pen
      priority: -1
      whitelist:
        tags:
        - Write
  - type: PdaBorderColor
    borderColor: "#7C5D00"
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        captain

