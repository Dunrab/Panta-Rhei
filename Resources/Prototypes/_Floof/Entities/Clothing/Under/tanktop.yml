# tanktops (top slot)
- type: entity
  parent: ClothingUndergarmentTopSwitchableBase
  id: ClothingUnderTopTanktopFire
  name: Fire Tanktop
  description: "A very comfy tank top to be worn on a nice hot day."
  components:
  - type: Sprite
    sprite: _Floof/Clothing/Under/Tops/tanktops.rsi
    state: tank_fire_fem_s
  - type: Clothing
    sprite: _Floof/Clothing/Under/Tops/tanktops.rsi
    clothingVisuals:
      undergarmentTop:
      - state: tank_fire_fem_s

