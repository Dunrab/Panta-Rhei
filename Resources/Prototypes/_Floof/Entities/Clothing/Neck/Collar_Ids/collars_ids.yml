  id: ClothingNeckCollarEmotionalSupportMedicalBase # medical base
  categories: [ HideSpawnMenu ]
  name: medical emotional support collar base
  description: A sterile and cute medical id collar.
  components:
  - type: Pda
    id: MedicalIDCard
    penSlot:
      startingItem: PenLightBase
      priority: -1
      whitelist:
        tags:
        - Write
  - type: PdaBorderColor
    borderColor: "#d7d7d0"
    accentVColor: "#447987"
  - type: CartridgeLoader
