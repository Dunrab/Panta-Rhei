- type: entity
  parent: BaseAction
  id: ActionSelfInject
  name: "[color=red]Stop Bleeding[/color]"
  description: Injects your self with a chemical to stop your bleeding.
  components:
  - type: Action
    icon: { sprite: Objects/Specific/Chemistry/syringe.rsi, state: syringe_base0 }
