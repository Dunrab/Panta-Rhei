- type: entity
  parent: [MobSiliconBase, StripableInventoryBase]
  id: MobTrashBot
  name: trashbot
  description: The creep of automation now threatening space janitors.
  components:
  - type: Fixtures # DeltaV - cleanbots can go beneath tables
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: Sprite
    drawdepth: SmallMobs # DeltaV - cleanbots can go beneath tables
    sprite: Mobs/Silicon/Bots/cleanbot.rsi
    state: cleanbot
  - type: Construction
    graph: CleanBot
    node: bot
  - type: SentienceTarget # DeltaV: upstream removed it, cleanbot works when player controlled
    flavorKind: station-event-random-sentience-flavor-mechanical
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: HTN
    rootTask:
      task: TrashbotCompound
  - type: InteractionPopup
    interactSuccessString: petting-success-cleanbot
    interactFailureString: petting-failure-cleanbot
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: Hands
  - type: HandsFill
    hands:
      trashbag: TrashBag
  - type: UseDelay
    delay: 0.5
  - type: Appearance
  - type: Dumpable
  - type: Inventory
    templateId: trashbotinventory # only display the hand from handsfill and a hat slot like medibots
  - type: Anchorable # anchorable becuase its funny
  - type: Vocalizer
  - type: DatasetVocalizer
    dataset: TrashbotAds # have it shit talk messes it has to clean up
