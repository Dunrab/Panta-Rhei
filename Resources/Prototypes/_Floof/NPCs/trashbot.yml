- type: htnCompound
  id: TrashbotCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: BufferNearbyTrashCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

# Picks a random puddle in range to move to and idle
- type: htnCompound
  id: BufferNearbyTrashCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyTrash

    # speak when it pathfinds to trash
    - !type:HTNPrimitiveTask
      operator: !type:SpeakOperator
        speech: !type:SingleSpeakOperatorSpeech
          line: trashbot-start-pickup
        hidden: true

    # pathfinding
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange

    #idle again once at the thing to pickup
    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: IdleTime
        amount: 3

    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime
      preconditions:
        - !type:KeyExistsPrecondition
          key: IdleTime

    # pickup
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: InteractRange
      operator: !type:InteractWithOperator
        targetKey: Target
      services:
      - !type:UtilityService
        id: TrashService
        proto: NearbyTrash
        key: Target
